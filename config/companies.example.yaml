project_name: Job Market Intelligence Pipeline
user_agent: job-market-intel/0.1.0 (+https://github.com/yourname/job-market-intel)
# history_scope: us-data-watch

directories:
  raw_dir: ../data/raw
  processed_dir: ../data/processed
  reports_dir: ../reports
  manifests_dir: ../artifacts/manifests
  history_dir: ../artifacts/history
  logs_dir: ../logs

retry:
  attempts: 3
  backoff_seconds: 1.5
  timeout_seconds: 30

dedupe:
  enabled: true
  similarity_threshold: 0.82

ai:
  enabled: false
  provider: openai
  model: gpt-4.1-mini
  endpoint: https://api.openai.com/v1/responses
  timeout_seconds: 45
  max_jobs_for_enrichment: 20
  temperature: 0.1
  max_description_chars: 2500
  narrative_top_n: 8

companies:
  - name: Stripe
    source_type: greenhouse
    identifier: stripe
    careers_url: https://stripe.com/jobs/search
  - name: Coinbase
    source_type: greenhouse
    identifier: coinbase
    careers_url: https://www.coinbase.com/careers/positions
  - name: Notion
    source_type: greenhouse
    identifier: notion
    careers_url: https://www.notion.so/careers
  - name: Plaid
    source_type: greenhouse
    identifier: plaid
    careers_url: https://plaid.com/careers/
  - name: Netlify
    source_type: lever
    identifier: netlify
    careers_url: https://www.netlify.com/careers/
  - name: Mux
    source_type: lever
    identifier: mux
    careers_url: https://www.mux.com/jobs
